about.text=FlipperJ %s\nby nanzee@chocotrophy\n\nFLI / AFLI / IFLI converter for the Commodore 64, inspired by Mufflon.\n\nInput: any image format Java ImageIO can read (plus TwelveMonkeys plugins) and C64 pictures (Koala, FLI, AFLI, Gunpaint, Funpaint, Drazlace …).\nOutput: runnable .prg with displayer and/or raw data.

