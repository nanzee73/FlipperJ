about.text=FlipperJ %s\nvon nanzee@chocotrophy\n\nFLI-/AFLI-/IFLI-Konverter für den Commodore 64, inspiriert von Mufflon.\n\nEingabe: jedes Bildformat, das Java ImageIO lesen kann (plus TwelveMonkeys-Plugins) und C64-Bilder (Koala, FLI, AFLI, Gunpaint, Funpaint, Drazlace …).\nAusgabe: startbare .prg mit Anzeigeprogramm und/oder Rohdaten.

