about.text=FlipperJ %s\ndoor nanzee@chocotrophy\n\nFLI- / AFLI- / IFLI-converter voor de Commodore 64, geïnspireerd door Mufflon.\n\nInvoer: elk beeldformaat dat Java ImageIO kan lezen (plus TwelveMonkeys-plug-ins) en C64-afbeeldingen (Koala, FLI, AFLI, Gunpaint, Funpaint, Drazlace …).\nUitvoer: uitvoerbare .prg met weergaveprogramma en/of ruwe data.

