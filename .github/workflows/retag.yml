# One-off maintenance: moves tags to other commits (used after rewriting the history).
# Actions ▸ Move tags ▸ Run workflow, input e.g. "v1.0.0=abc1234 v1.1.0=def5678".
# Tags pushed with the workflow token do not start other workflows, so nothing is rebuilt.
name: Move tags

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'tag=commit pairs, separated by spaces'
        required: true

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move tags
        env:
          PAIRS: ${{ github.event.inputs.tags }}
        run: |
          for p in $PAIRS; do
            t="${p%%=*}"; c="${p#*=}"
            git cat-file -e "$c^{commit}" || { echo "::error::$c is no commit"; exit 1; }
            git tag -f "$t" "$c"
            git push -f origin "refs/tags/$t"
            echo "$t -> $c"
          done
