# Builds FlipperJ for Linux, Windows and macOS.
#  - Push a tag like v1.0.0 (or create a release with a new tag on GitHub): all packages are built
#    and attached to that release.
#  - Every push to main that changes code or build files: all packages are built and the pre-release
#    "Development build" (tag latest-dev) is replaced by them. README or other doc changes build nothing.
#  - "Run workflow" on the Actions tab: test build, packages are available as workflow artifacts.
#
# File names (the same scheme as MuleJ):
#   FlipperJ-<version>-<platform>.msi / .dmg / .deb      installer with bundled Java
#   FlipperJ-<version>-<platform>-portable.zip / .tar.gz  portable app folder with bundled Java (Windows, Linux)
#   FlipperJ-<version>-all-platforms-java17.zip           start scripts bin/flipperj and bin/flipperj.bat, needs Java 17+
#   FlipperJ-<version>-all-platforms-java17.jar           single jar (java -jar), needs Java 17+
# <platform>: linux-x64, windows-x64, windows-x86 (32-bit), macos-arm64 (Apple Silicon), macos-x64 (Intel)
name: Build & Release

on:
  push:
    tags: ['v*']                 # path filters below are not applied to tags
    branches: [main]
    paths:                       # only code and build changes make a new development build
      - 'src/**'
      - 'packaging/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# a newer push to main cancels a development build that is still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: windows-latest
            label: windows-x86      # 32-bit Windows: Temurin ships 32-bit Java only up to 17
            java: '17'
            arch: x86
            heap: 1g                # a 32-bit Java cannot reserve much more
          - os: macos-latest
            label: macos-arm64      # Apple Silicon
          - os: macos-15-intel
            label: macos-x64        # Intel Macs
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '21' }}
          architecture: ${{ matrix.arch || 'x64' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then F="$V"; else F="dev"; fi
          echo "FILE_VERSION=$F" >> "$GITHUB_ENV"       # in file names: version of the tag, otherwise "dev"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then D="$V"; else D="dev-${GITHUB_SHA::7}"; fi
          echo "DISPLAY_VERSION=$D" >> "$GITHUB_ENV"    # shown in the title bar and the About box
          echo "Building version $V"

      - name: WiX Toolset (needed for the Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Tests, jar and zip with start scripts (need installed Java 17+)
        if: runner.os == 'Linux'
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon -PappVersion=$APP_VERSION test distZip shadowJar 2>&1 | tee gradle.log; then
            grep -E "What went wrong|e: |error:|FAILED|Exception|> " gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p dist-all
          cp build/distributions/flipperj-$APP_VERSION.zip dist-all/FlipperJ-$FILE_VERSION-all-platforms-java17.zip
          cp build/libs/flipperj-$APP_VERSION-all.jar dist-all/FlipperJ-$FILE_VERSION-all-platforms-java17.jar

      - name: Installer with bundled Java
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon -PappVersion=$APP_VERSION -PmaxHeap=${{ matrix.heap || '' }} jpackage 2>&1 | tee gradle.log; then
            grep -E "What went wrong|e: |error:|FAILED|Exception|> " gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p dist
          for f in build/jpackage/*.dmg build/jpackage/*.msi build/jpackage/*.deb; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "dist/FlipperJ-$FILE_VERSION-${{ matrix.label }}.$ext"
          done

      - name: Portable app folder with bundled Java (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          ./gradlew --no-daemon -PappVersion=$APP_VERSION -PmaxHeap=${{ matrix.heap || '' }} -PinstallerType=app-image jpackage
          cd build/jpackage
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "../../dist/FlipperJ-$FILE_VERSION-${{ matrix.label }}-portable.zip" FlipperJ > /dev/null
          else
            tar czf "../../dist/FlipperJ-$FILE_VERSION-${{ matrix.label }}-portable.tar.gz" FlipperJ
          fi

      - name: List packages
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FlipperJ-${{ env.FILE_VERSION }}-${{ matrix.label }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: FlipperJ-${{ env.FILE_VERSION }}-all-platforms-java17
          path: dist-all/*

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist-all/*
          generate_release_notes: true

  dev-release:
    name: Development build release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Remove the previous development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          target_commitish: ${{ github.sha }}
          name: Development build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of the latest code on main (commit ${{ github.sha }}).
            Not an official version – for those see the releases with a version number.
          files: dist/*
